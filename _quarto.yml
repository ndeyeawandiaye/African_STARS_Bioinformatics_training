project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - course/00-command_line.md
    - course/*.qmd
    - exercises/*.md

website:
  title: "African STRAS Fellowship - Bioinformatics Training"
  page-navigation: true
  bread-crumbs: true
  search:
    location: sidebar
  navbar:
    background: primary
    search: true
    tools:
      - icon: github
        menu:
          - text: Source code
            href: https://ndeyeawandiaye.github.io/African_STARS_Bioinformatics_training/
          - text: Report an issue
            href: https://ndeyeawandiaye.github.io/African_STARS_Bioinformatics_training/issues
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
      - section: "Basic command line"
        contents:
          - course/00-command_line.md

      - section: "Viral Genomics"
        contents:
        - section: "Preparations"
          contents:
            - exercises/00_setup.md
        - section: "FASTQ → consensus genome"
          contents:
            - course/01-concepts.qmd
            - exercises/01_fastq_and_qc.md
            - exercises/02_mapping.md
            - exercises/03_coverage_consensus.md
        - section: "Alignment, lineage & reference selection"
          contents:
            - course/02-reference-selection.qmd
            - course/02-alignment.qmd
            - course/02-lineage.qmd
        - section: "Build and read a phylogenetic tree"
          contents:
            - course/03-build-tree.qmd
            - course/03-read-tree.qmd
      - section: "Human genomic"
        contents:
          - course/Fastq-to-bcl.qmd

  page-footer:
    left: "African STARS Fellowship · CARE · Institut Pasteur — synthetic training data only"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
